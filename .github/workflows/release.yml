name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: Build & integration-test ${{ matrix.distribution }} JDK ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: '8'
            distribution: temurin
          - target: '11'
            distribution: temurin
          - target: '17'
            distribution: temurin
          - target: '21'
            distribution: oracle
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          else
            v="0.0.0-${GITHUB_SHA::7}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: $v"

      - name: Set up target ${{ matrix.distribution }} JDK ${{ matrix.target }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.target }}
          distribution: ${{ matrix.distribution }}

      - name: Set up JDK 21 for Gradle
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build for JDK ${{ matrix.target }}
        run: |
          chmod +x gradlew
          # mletUrl deliberately omitted: the build.gradle default (an
          # RFC1918 placeholder) is what we want baked into the shipped
          # woot.html. jmxshell rewrites it at runtime from --url.
          ./gradlew --no-daemon clean build distZip mletFile \
              -PtargetJdk=${{ matrix.target }} \
              -PreleaseVersion=${{ steps.ver.outputs.version }}

      - name: Integration test on JDK ${{ matrix.target }}
        shell: bash
        env:
          TARGET_JDK: ${{ matrix.target }}
          SKIP_BUILD: '1'
        run: |
          var="JAVA_HOME_${TARGET_JDK}_X64"
          target_home="${!var}"
          if [ -z "$target_home" ]; then
            echo "Could not resolve target JDK home for $var" >&2
            exit 1
          fi
          "$target_home/bin/java" -version
          chmod +x scripts/integration-test.sh
          JAVA_HOME="$target_home" scripts/integration-test.sh "${TARGET_JDK}"

      - name: Verify distribution zip
        shell: bash
        run: |
          zip="build/distributions/jmxshell-${{ steps.ver.outputs.version }}-jdk${{ matrix.target }}.zip"
          if [ ! -f "$zip" ]; then
            echo "Expected $zip not found" >&2
            ls -la build/distributions || true
            exit 1
          fi
          unzip -l "$zip"

      - name: Upload jdk${{ matrix.target }} distribution
        uses: actions/upload-artifact@v4
        with:
          name: jmxshell-jdk${{ matrix.target }}
          path: build/distributions/jmxshell-${{ steps.ver.outputs.version }}-jdk${{ matrix.target }}.zip
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all distribution zips
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: jmxshell-jdk*
          merge-multiple: true

      - name: List release assets
        shell: bash
        run: ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/jmxshell-*-jdk*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
